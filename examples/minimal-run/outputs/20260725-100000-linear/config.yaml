seed: 42
run:
  name: linear
  output_root: outputs
  retention: retained
  retention_reason: runnable example retained run
data:
  version: synthetic_v1
  processed: data/processed/synthetic_v1.json
  manifest: data/manifests/synthetic_v1.json
  generate:
    n_samples: 200
    x_min: 0.0
    x_max: 10.0
    slope: 2.0
    intercept: 1.0
    noise_std: 0.5
training:
  epochs: 1000
optimizer:
  lr: 0.02
assumptions:
- Synthetic data generated in-process; not a real measurement.
- Full-batch gradient descent; deterministic given the data.

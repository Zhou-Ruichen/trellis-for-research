[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-demo"
version = "0.1.0"
description = "Minimal runnable example for the General Computational Research template."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

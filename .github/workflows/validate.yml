name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate marketplace
        run: python3 scripts/validate.py

      - name: Run minimal example
        run: python3 examples/minimal-run/analysis.py
